# Настройки setup-ai395.sh. Подхватываются автоматически, если лежат рядом со скриптом.
# Любую переменную можно переопределить из окружения: CTX=131072 ./setup-ai395.sh halo-coder

# ── Пути ─────────────────────────────────────────────────────────────
AI_HOME="$HOME/ai395"                       # всё наше: бинарники, venv, логи
MODEL_DIR="$HOME/models/qwen38unc"          # веса Flash-Next и MTP-голова
OLLAMA_MODELS_DIR=""                        # пусто = каталог ollama по умолчанию; можно, напр., /mnt/ai/ollama

# ── Память / ядро ────────────────────────────────────────────────────
AMD_IOMMU_OFF=1         # amd_iommu=off: +13–16% prefill у halogen, но выключает NPU и DMA-трансляцию. 0 = iommu=pt
SWAP_GB=32              # страховочный swapfile под пиковый контекст (на halo спас от OOM)
DISABLE_ZSWAP=1         # квантованные веса не сжимаются, zswap только съедает ОЗУ (разбор OOM 22.10)

# ── Какой движок держит Qwen3.8-Flash-Next ──────────────────────────
# halogen — halogen-flash-server (peonist-ai), ядра под Strix Halo: prefill ~1700 т/с, первый токен ~1.6 с.
# llama   — halo-coder на llama.cpp (Vulkan). Оба сразу не влезут: halogen забирает почти всю память.
ENGINE=halogen

# ── halogen-flash-server ─────────────────────────────────────────────
HG_MODEL="fast"              # fast = чекпоинт halogen v2, максимум скорости (с цензурой)
                              # uncensored = Qwen3.8-Flash-Next-Uncensored GGUF (без цензуры, генерация ~в 1.5–2 раза медленнее)
                              # переключать потом: ./halogen-fast.sh fast|uncensored
HG_IMAGE="ghcr.io/peonist-ai/halogen-flash-server:0.20.1"   # тег закреплён: так откатывается плохой релиз
HG_PUBLISH="0.0.0.0:8731"     # 127.0.0.1:8731 — только локально
HG_API_KEY=1                  # 1 = сгенерировать ключ (~/ai395/halogen.key); без него API открыт всем в сети
HG_WEIGHTS_REPO="peonist-ai/halogen-qwen3.8-flash-next"   # отсюда только драфт-голова и токенайзер (1.4 ГиБ)
HG_EXTRA_ENV=""               # напр. "HALOGEN_KV_POOL_POSITIONS=262144 HALOGEN_KV_SLOTS=2" — оставить память соседям

# ── llama.cpp ────────────────────────────────────────────────────────
LLAMA_REPO="https://github.com/ggml-org/llama.cpp.git"
LLAMA_REF="b11627"      # = код df18bee11, на котором halo-coder работал стабильно под Linux

# ── halo-coder (Qwen3.8-Flash-Next без цензуры) ──────────────────────
MODEL_REPO="mradermacher/Qwen3.8-Flash-Next-Uncensored-i1-GGUF"
MODEL_FILE="Qwen3.8-Flash-Next-Uncensored.i1-IQ4_XS.gguf"
MTP=1                   # 1 = спекулятивное декодирование MTP-головой (+5% проза, +30% код)
MTP_REPO="ggml-org/Qwen3.8-Flash-Next-GGUF"
MTP_FILE="mtp-Qwen3.8-Flash-Next-Q8_0.gguf"
MTP_REQUANT=1           # пережать output.weight головы в Q5_K (быстрее драфт, как на halo)
QSA=1                   # включить QSA в копии весов (в файле mradermacher оно выключено ошибкой конвертации)

HC_ALIAS="qwen38-flash-next-unc"
HC_HOST="127.0.0.1"     # 0.0.0.0 — если ходить в сервер напрямую по LAN, без туннеля
HC_PORT=8088
CTX=262144              # при OOM уменьшить до 131072
SLOTS=1
CACHE_RAM_MIB=2048      # дефолт llama-server 8192 — именно он добивал память до OOM
UBATCH=512              # ub512 на Vulkan быстрее 2048
DRAFT_N_MAX=3
DRAFT_P_MIN=0.75
WATCHDOG=1              # таймер: перезапуск, если /slots не отвечает (ловит «завис при health 200»)

# ── Ollama ───────────────────────────────────────────────────────────
OLLAMA_BIND="127.0.0.1:11434"   # 0.0.0.0:11434 — открыть для LAN
OLLAMA_CTX=131072
OLLAMA_PULL=""                  # модели через пробел, напр. "qwen3:8b nomic-embed-text"

# ── PyTorch ROCm ─────────────────────────────────────────────────────
# Колёса AMD TheRock именно под gfx1151 (Radeon 8060S). ROCm-рантайм внутри, системный ROCm не нужен.
TORCH_INDEX="https://rocm.nightlies.amd.com/v2/gfx1151/"
TORCH_PYTHON="3.12"
